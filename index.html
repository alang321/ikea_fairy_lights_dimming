<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Light">
<link rel="icon" href="data:,">
<title>Light</title>
<style>
  :root { --bg: #0b0b0d; --track: #1b1b20; --fg: #f3efe8; --dim: #77737c; --b: 0;
    --lo: 255, 143, 51; --hi: 255, 180, 107; --glow: 255, 190, 110; }   /* set from JS by brightness */
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  html, body { height: 100%; color: var(--fg); overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body { height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    padding: max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background: radial-gradient(60% 50% at 50% 55%, rgba(var(--glow), .28), transparent 70%);
    opacity: var(--b); transition: opacity .4s; }
  #pct { position: relative; height: 72px; line-height: 72px; font-size: 60px; font-weight: 200;
    font-variant-numeric: tabular-nums; transition: opacity .3s;
    filter: drop-shadow(0 0 calc(var(--b) * 14px) rgba(var(--glow), calc(var(--b) * .7))); }
  body:not(.ready) #pct { opacity: 0; }
  #num, #off { transition: opacity .3s, transform .35s cubic-bezier(.2, .8, .2, 1); }
  #num { display: flex; justify-content: center; }
  #off { position: absolute; left: 50%; top: 0; translate: -50% 0; opacity: 0; transform: translateY(14px); }
  body:not(.on) #num { opacity: 0; transform: translateY(-14px); }
  body:not(.on) #off { opacity: 1; transform: none; }
  /* odometer: each digit is a 0-9 strip that rolls into place */
  .col { display: block; height: 72px; width: .56em; overflow: hidden;
    transition: width .35s cubic-bezier(.2, .8, .2, 1), opacity .25s; }
  .col.hide { width: 0; opacity: 0; }
  .strip { display: flex; flex-direction: column; transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
  .strip span { height: 72px; text-align: center; }
  .unit { margin-left: .04em; }
  #bar { position: relative; flex: 1; width: min(44vw, 170px); max-height: 560px; border-radius: 38px; will-change: transform;
    background: var(--track); overflow: hidden; touch-action: none; cursor: ns-resize;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
  #fill { position: absolute; inset: 0; border-radius: inherit; clip-path: inset(100% 0 0 0);
    background: linear-gradient(to top, rgb(var(--lo)), rgb(var(--hi))); }
  body.anim #fill { transition: clip-path .4s cubic-bezier(.4, 0, .2, 1); }
  #bar.spring { transition: transform .6s cubic-bezier(.25, 1.7, .5, 1); }   /* overshoots a bit when let go */
  #btn { width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--track); color: var(--dim);
    display: grid; place-items: center; touch-action: manipulation; cursor: pointer; transition: background .3s, color .3s, box-shadow .3s; }
  #btn svg { width: 32px; height: 32px; }
  body.on #btn { background: #ffc98a; color: #3a2207; box-shadow: 0 0 36px rgba(255, 180, 100, .45); }
  #status { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
    font-size: 13px; color: var(--dim); opacity: 0; transition: opacity .3s; }
  body.offline #status { opacity: 1; }
  body.offline #bar, body.offline #btn, body.offline #pct { opacity: .35; }
  @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; } }
</style>
</head>
<body class="offline">
  <div id="status">connecting…</div>
  <div id="pct"><span id="num"><span class="col"></span><span class="col"></span><span class="col"></span><span class="unit">%</span></span><span id="off">Off</span></div>
  <div id="bar"><div id="fill"></div></div>
  <button id="btn" aria-label="On/off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
  </button>
<script>
const $ = id => document.getElementById(id);
const bar = $("bar"), fill = $("fill"), btn = $("btn"), body = document.body;
let level = 0.5, on = false, ws = null, drag = null, pending = null, raf = 0;
const clamp = x => Math.min(1, Math.max(0, x));
const tick = ms => { if (navigator.vibrate) navigator.vibrate(ms); };   // Android only

// Odometer digits: columns are [hundreds, tens, ones], each a 0-9 strip shifted into place.
const cols = [...document.querySelectorAll(".col")];
cols.forEach(c => c.innerHTML = `<span class="strip">${[...Array(10).keys()].map(d => `<span>${d}</span>`).join("")}</span>`);
function showNumber(n) {
  [Math.floor(n / 100), Math.floor(n / 10) % 10, n % 10].forEach((d, i) => {
    cols[i].firstChild.style.transform = `translateY(${-d * 10}%)`;
    cols[i].classList.toggle("hide", i < 2 && n < 10 ** (2 - i));   // no leading zeros
  });
}

// Colour follows brightness: deep amber when dim, warm white at the top.
const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t)).join(", ");
function tint(t) {
  const r = document.documentElement.style;
  r.setProperty("--lo", mix([255, 132, 40], [255, 214, 166], t));    // bottom of the fill
  r.setProperty("--hi", mix([255, 176, 100], [255, 248, 238], t));   // top of the fill
  r.setProperty("--glow", mix([255, 160, 80], [255, 236, 210], t));
}

// Rubber band: dragging past either end stretches the bar a little, with diminishing returns.
function stretch(over) {
  const r = 1 - 1 / (Math.abs(over) * 4 + 1);
  bar.style.transformOrigin = over > 0 ? "50% 100%" : "50% 0%";
  bar.style.transform = r ? `scale(${1 - r * 0.04}, ${1 + r * 0.08})` : "";
}

function render(animate) {
  body.classList.toggle("anim", !!animate);
  body.classList.toggle("on", on);
  body.classList.add("ready");
  if (on) showNumber(Math.max(1, Math.round(level * 100)));
  fill.style.clipPath = `inset(${(1 - (on ? level : 0)) * 100}% 0 0 0)`;
  document.documentElement.style.setProperty("--b", on ? level : 0);
  tint(on ? level ** 1.5 : 0);   // stays amber through most of the range, whitens toward the top
}

// Send at most once per animation frame (~60/s), and only when the previous message has left
// the phone, so the latest slider value always wins and nothing piles up on a slow network.
function send(msg) { pending = msg; if (!raf) raf = requestAnimationFrame(flush); }
function flush() {
  raf = 0;
  if (!pending || !ws || ws.readyState !== 1) return;
  if (ws.bufferedAmount > 0) { raf = requestAnimationFrame(flush); return; }
  ws.send(JSON.stringify(pending));
  pending = null;
}

// Drag anywhere on the bar; it moves relative to your finger, so touching never makes it jump.
bar.addEventListener("pointerdown", e => {
  bar.setPointerCapture(e.pointerId);
  bar.classList.remove("spring");
  drag = { y: e.clientY, start: on ? level : 0, moved: false, step: Math.round((on ? level : 0) * 10) };
});
bar.addEventListener("pointermove", e => {
  if (!drag) return;
  drag.moved = true;
  const raw = drag.start + (drag.y - e.clientY) / bar.clientHeight;
  level = clamp(raw);
  on = level > 0;
  stretch(raw - level);
  const step = Math.round(level * 10);                 // haptic tick every 10 %, a firmer one at the ends
  if (step !== drag.step) { tick(level === 0 || level === 1 ? 14 : 4); drag.step = step; }
  render(false);
  send({ b: level });
});
function endDrag() {
  if (drag && drag.moved) send({ b: level, done: 1 });
  drag = null;
  bar.classList.add("spring");
  stretch(0);
}
bar.addEventListener("pointerup", endDrag);
bar.addEventListener("pointercancel", endDrag);

btn.addEventListener("click", () => {
  on = !on;
  if (on && level < 0.01) level = 0.5;
  render(true);
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ on }));
  tick(8);
});

function connect() {
  if (ws) return;
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => body.classList.remove("offline");
  ws.onmessage = e => {
    if (drag) return;                        // your finger wins while dragging
    const s = JSON.parse(e.data);
    level = s.b; on = s.on;
    render(true);
  };
  ws.onclose = () => {
    ws = null; pending = null;
    body.classList.add("offline");
    if (!document.hidden) setTimeout(connect, 1000);
  };
}
// Close when the page is hidden (phone locked, app switched), reconnect when it comes back.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (ws) ws.close(); } else connect();
});
setInterval(() => { if (ws && ws.readyState === 1) ws.send("{}"); }, 20000);   // keepalive
connect();
</script>
</body>
</html>
